
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #234;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 6px 0 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Grade Calculator</h2>

    <form id="gradeForm">
        <label>Subject 1:</label>
        <input type="number" id="s1" min="0" max="100"
               step="any" required>

        <label>Subject 2:</label>
        <input type="number" id="s2" min="0" max="100"
               step="any" required>

        <label>Subject 3:</label>
        <input type="number" id="s3" min="0" max="100"
               step="any" required>

        <label>Subject 4:</label>
        <input type="number" id="s4" min="0" max="100"
               step="any" required>

        <label>Subject 5:</label>
        <input type="number" id="s5" min="0" max="100"
               step="any" required>

        <button type="submit">Calculate Grade</button>
    </form>

    <div id="result" aria-live="polite"></div>
</div>

<script>
document.getElementById("gradeForm")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        let marks = [];

        for (let i = 1; i <= 5; i++) {
            let input = document.getElementById("s" + i);
            let mark = input.valueAsNumber;

            if (input.value.trim() === "" ||
                !Number.isFinite(mark) ||
                mark < 0 || mark > 100) {
                document.getElementById("result").textContent =
                    "Please enter valid marks (0–100) for all subjects.";
                input.focus();
                return;
            }

            marks.push(mark);
        }

        let total = marks.reduce((sum, mark) => sum + mark, 0);
        let average = total / 5;
        let percentage = (total / 500) * 100;
        let grade;

        if (percentage >= 90) {
            grade = "A+";
        } else if (percentage >= 80) {
            grade = "A";
        } else if (percentage >= 70) {
            grade = "B";
        } else if (percentage >= 60) {
            grade = "C";
        } else if (percentage >= 50) {
            grade = "D";
        } else {
            grade = "F (Fail)";
        }

        document.getElementById("result").innerHTML =
            "<h3>Results</h3>" +
            "Total Marks: " + total.toFixed(2) + " / 500<br>" +
            "Average: " + average.toFixed(2) + "<br>" +
            "Percentage: " + percentage.toFixed(2) + "%<br>" +
            "Grade: <strong>" + grade + "</strong>";
    });
</script>

</body>
</html>
